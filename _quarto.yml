# Quarto 1.8 可渲染嵌套 part，但 YAML schema 仅接受一层；目录层级另行验证。
validate-yaml: false

project:
  type: book
  output-dir: docs          # GitHub Pages 从 main 分支的 docs/ 发布
  post-render:
    - python scripts/prepare_images.py
    - python scripts/prepare_directory.py
  resources:
    # .nojekyll 让 Pages 跳过 Jekyll（否则 site_libs/ 可能被忽略）；
    # quarto render 会清空 output-dir，声明成 resource 才不会丢。
    - /.nojekyll
    - /assets/module-maps/**
    - /assets/figure-previews/**
    - /assets/note-directory.js
    - /assets/sidebar-navigation.js
    - /regr/bench/cox_cif_20261002_*
    - /regr/bench/get_score_20261003_*
    - /regr/bench/get_score_20261007_*
    - /regr/bench/mlr_vpd_20261006_*
    - /regr/bench/mlr_imp_20261006_*
    - /regr/bench/mlr_shp_20261006_*
    - /regr/bench/rstudio_wsl_20261007_*
    - /regr/rstudio-wsl-diagnostics-20261007.html

