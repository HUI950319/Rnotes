execute:
  freeze: auto              # 代码块结果缓存在 _freeze/，只在源文件变化时重跑

format:
  html:
    include-after-body:
      text: |
        <script src="/assets/sidebar-navigation.js"></script>
    theme:
      light: [cosmo, custom.scss]
      dark:  [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    grid:
      body-width: 860px
      sidebar-width: 320px
      margin-width: 300px

lang: zh
