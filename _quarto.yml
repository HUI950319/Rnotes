project:
  type: book
  output-dir: docs          # GitHub Pages 从 main 分支的 docs/ 发布
  resources:
    # .nojekyll 让 Pages 跳过 Jekyll（否则 site_libs/ 可能被忽略）；
    # quarto render 会清空 output-dir，声明成 resource 才不会丢。
    - /.nojekyll
    - /assets/module-maps/**

book:
  title: "R 包开发笔记"
  subtitle: "RegR · MLR · UtilsR · seerR · LabR · scMMR · ToyData · causalR"
  author: "HUI950319"
  site-url: https://hui950319.github.io/Rnotes/
  repo-url: https://github.com/HUI950319/Rnotes
  repo-actions: [source, issue]
  search: true
  page-navigation: true
  sidebar:
    style: docked
    collapse-level: 1
  chapters:
    - index.qmd
    - part: "RegR · 临床回归与可视化"
      chapters:
        - regr/function-modules.qmd
        - regr/flow-guide.qmd
        - regr/forest-guide.qmd
        - regr/cat-guide.qmd
        - regr/facet-guide.qmd
        - regr/interaction-guide.qmd
        - regr/rcs-guide.qmd
        - regr/cut-guide.qmd
        - regr/rpa-guide.qmd
        - regr/ps-guide.qmd
        - regr/variable-selection-guide.qmd
        - regr/table-guide.qmd
        - regr/um-guide.qmd
        - regr/eff-cat-guide.qmd
        - regr/model-evaluation-guide.qmd
        - regr/nomogram-guide.qmd
        - regr/conditional-survival-guide.qmd
        - regr/hazard-guide.qmd
        - regr/gbtm-guide.qmd
        - regr/effect-comparison-guide.qmd
        - regr/get-eff-cif-benchmark.qmd
    - part: "MLR · 机器学习解释"
      chapters:
        - mlr/function-modules.qmd
        - mlr/index.qmd
        - mlr/shap-guide.qmd
        - mlr/imp-guide.qmd
        - mlr/vpd-guide.qmd
        - mlr/interaction-guide.qmd
        - mlr/shap-clust-guide.qmd
        - mlr/pdp-guide.qmd
        - mlr/model-selection-guide.qmd
        - mlr/hyper-tuning-guide.qmd
        - mlr/feature-selection-guide.qmd
        - mlr/model-evaluation-guide.qmd
        - mlr/calibration-dca-guide.qmd
    - part: "UtilsR · 通用工具"
      chapters:
        - utilsr/function-modules.qmd
        - utilsr/index.qmd
        - utilsr/categorical-guide.qmd
        - utilsr/continuous-guide.qmd
        - utilsr/format-guide.qmd
        - utilsr/palette-guide.qmd
        - utilsr/missing-guide.qmd
        - utilsr/scatter-guide.qmd
        - utilsr/flow-guide.qmd
        - utilsr/sets-guide.qmd
        - utilsr/comparison-guide.qmd
        - utilsr/rank-guide.qmd
        - utilsr/factor-guide.qmd
        - utilsr/composition-guide.qmd
    - part: "seerR · SEER 数据处理"
      chapters:
        - seerr/function-modules.qmd
        - seerr/index.qmd
    - part: "LabR · 基础实验作图"
      chapters:
        - labr/function-modules.qmd
        - labr/index.qmd
    - part: "scMMR · 单细胞多任务模型"
      chapters:
        - scmmr/function-modules.qmd
        - scmmr/index.qmd
    - part: "ToyData · 示例数据"
      chapters:
        - toydata/function-modules.qmd
        - toydata/index.qmd
    - part: "causalR · 因果推断与效应异质性"
      chapters:
        - causalr/function-modules.qmd
        - causalr/index.qmd
        - causalr/tree-stability-guide.qmd
        - causalr/icf-plot-guide.qmd
        - causalr/hte-diagnostics-guide.qmd
        - causalr/method-selection-guide.qmd
        - causalr/survival-estimands-guide.qmd
        - causalr/clinical-workflow-guide.qmd

execute:
  freeze: auto              # 代码块结果缓存在 _freeze/，只在源文件变化时重跑

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark:  [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: false
    code-copy: true
    grid:
      body-width: 860px
      sidebar-width: 400px
      margin-width: 360px

lang: zh
