name: Check published site

on: [push, pull_request]

permissions:
  contents: read

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.4.3'
      - run: python -m pip install beautifulsoup4==4.14.3 PyYAML==6.0.3 playwright==1.63.0
      - run: python -m playwright install --with-deps chromium --only-shell
      - run: python scripts/check_site.py
      - run: python scripts/check_source_links.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: Rscript scripts/check_examples.R
      - run: python scripts/check_browser.py
